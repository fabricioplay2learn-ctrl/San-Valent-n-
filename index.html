<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>José ❤️ América</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#ff6fa5,#d63384,#8e2de2);
color:white;
overflow:hidden;
}

/* Fondo animado */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* Pantallas */
.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:25px;
backdrop-filter:blur(15px);
transition:1s ease;
}

.hidden{
opacity:0;
pointer-events:none;
transform:scale(0.9);
}

/* Títulos */
h1{
font-family:'Great Vibes',cursive;
font-size:55px;
margin-bottom:20px;
}

/* Texto animado */
.fade-text{
opacity:0;
transform:translateY(20px);
transition:1s ease;
margin-bottom:15px;
max-width:700px;
}

.fade-text.show{
opacity:1;
transform:translateY(0);
}

/* Botón corazón */
.heart-btn{
margin-top:20px;
padding:15px 35px;
border:none;
border-radius:50px;
background:white;
color:#d63384;
font-weight:bold;
font-size:16px;
cursor:pointer;
box-shadow:0 0 20px rgba(255,255,255,0.5);
animation:heartbeat 1.6s infinite;
transition:0.3s;
}

@keyframes heartbeat{
0%{transform:scale(1);}
25%{transform:scale(1.12);}
40%{transform:scale(1);}
60%{transform:scale(1.18);}
100%{transform:scale(1);}
}

.heart-btn:hover{
transform:scale(1.1);
}

/* Scroll historia */
.story-container{
max-height:65vh;
overflow-y:auto;
padding:10px;
}

/* Evento especial */
.special-day{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:999;
text-align:center;
}

.special-day h2{
font-family:'Great Vibes',cursive;
font-size:50px;
margin-bottom:20px;
}

@media(max-width:600px){
h1{font-size:38px;}
.special-day h2{font-size:32px;}
}
</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- INICIO -->
<div class="screen" id="inicio">
<h1>José & América 💖</h1>
<p class="fade-text show">
El destino nos separó una vez…  
pero decidió volver a unirnos.
</p>
<button class="heart-btn" onclick="irOpciones()">Entrar a nuestra historia ✨</button>
</div>

<!-- OPCIONES -->
<div class="screen hidden" id="opciones">
<h1>Nuestras Historias 💞</h1>
<button class="heart-btn" onclick="verHistoria(1)">Ofir y el Amor</button>
<button class="heart-btn" onclick="verHistoria(2)">Donde Siempre Volvimos a Elegirnos</button>
<button class="heart-btn" onclick="volverInicio()">Volver</button>
</div>

<!-- HISTORIA -->
<div class="screen hidden" id="historia">
<h1 id="tituloHistoria"></h1>
<div class="story-container" id="contenidoHistoria"></div>
<button class="heart-btn" onclick="volverOpciones()">Elegir otra historia</button>
</div>

<script>

/* Navegación */
function irOpciones(){
document.getElementById("inicio").classList.add("hidden");
document.getElementById("opciones").classList.remove("hidden");
}

function volverInicio(){
document.getElementById("opciones").classList.add("hidden");
document.getElementById("inicio").classList.remove("hidden");
}

function volverOpciones(){
document.getElementById("historia").classList.add("hidden");
document.getElementById("opciones").classList.remove("hidden");
}

function verHistoria(num){
let titulo=document.getElementById("tituloHistoria");
let contenido=document.getElementById("contenidoHistoria");

if(num===1){
titulo.innerText="Ofir y el Amor";
contenido.innerHTML=`
<p class="fade-text">Había una vez un soñador llamado José Fabricio.</p>
<p class="fade-text">Construía algo grande llamado Ofir, lleno de visión y esperanza.</p>
<p class="fade-text">Pero el verdadero tesoro no era oro… era América.</p>
<p class="fade-text">Ella fue apoyo cuando el camino era difícil.</p>
<p class="fade-text">Fue calma cuando el estrés pesaba.</p>
<p class="fade-text">Fue fe cuando aún no se veían los frutos.</p>
<p class="fade-text">Mientras él soñaba con grandeza,</p>
<p class="fade-text">ella soñaba con verlo lograrlo.</p>
<p class="fade-text">No era solo una historia de comercio.</p>
<p class="fade-text">Era una historia de amor que crecía junto a cada meta.</p>
`;
}

if(num===2){
titulo.innerText="Donde Siempre Volvimos a Elegirnos";
contenido.innerHTML=`
<p class="fade-text">Nos conocimos hace casi dos años.</p>
<p class="fade-text">La vida nos separó…</p>
<p class="fade-text">pero un juego nos volvió rivales.</p>
<p class="fade-text">Y el destino nos volvió a unir.</p>
<p class="fade-text">Desde Cochabamba viajé hasta Potosí para verte.</p>
<p class="fade-text">Para abrazarte.</p>
<p class="fade-text">Para amarte.</p>
<p class="fade-text">Viajé una vez.</p>
<p class="fade-text">Luego otra.</p>
<p class="fade-text">Y lo volvería a hacer mil veces más.</p>
<p class="fade-text">El 19 de diciembre de 2025 nos comprometimos.</p>
<p class="fade-text">Y aunque después de cada despedida llorabas,</p>
<p class="fade-text">no era tristeza… era amor profundo.</p>
<p class="fade-text">Porque siempre, sin importar la distancia,</p>
<p class="fade-text">nos volvemos a elegir.</p>
`;
}

document.getElementById("opciones").classList.add("hidden");
document.getElementById("historia").classList.remove("hidden");

animarTexto();
}

/* Animar aparición */
function animarTexto(){
const textos=document.querySelectorAll(".fade-text");
textos.forEach((t,i)=>{
setTimeout(()=>{t.classList.add("show");}, i*700);
});
}

/* Fondo partículas */
const canvas=document.getElementById("bg");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<70;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:Math.random()*2+1,
speed:Math.random()*1+0.3
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.fillStyle="rgba(255,255,255,0.7)";
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
ctx.fill();
p.y-=p.speed;
if(p.y<0){p.y=canvas.height;}
});
requestAnimationFrame(animate);
}
animate();

/* Evento especial 19 diciembre */
let today=new Date();
if(today.getDate()===19 && today.getMonth()===11){
let special=document.createElement("div");
special.classList.add("special-day");
special.innerHTML=`
<h2>19 de Diciembre 💍</h2>
<p>El día que prometimos elegirnos para siempre.</p>
<button class="heart-btn" onclick="this.parentElement.remove()">Cerrar</button>
`;
document.body.appendChild(special);
}

</script>

</body>
</html>
