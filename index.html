<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para América ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ff758c,#ff7eb3);
height:100vh;
overflow:hidden;
color:white;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

/* Pantallas */
.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:30px;
transition:opacity 1s ease, transform 1s ease;
}

.hidden{
opacity:0;
pointer-events:none;
transform:scale(0.9);
}

/* Animación entrada */
.fadeIn{
animation:fade 2s ease forwards;
}

@keyframes fade{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* Corazones flotando */
.heart{
position:absolute;
bottom:-50px;
font-size:20px;
animation:float 8s linear infinite;
opacity:0.6;
}

@keyframes float{
0%{transform:translateY(0) scale(1);}
100%{transform:translateY(-110vh) scale(1.5);}
}

/* Botones */
button{
margin-top:20px;
padding:12px 25px;
border:none;
border-radius:30px;
background:white;
color:#ff4f81;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#ffe6ef;
transform:scale(1.05);
}

/* Títulos románticos */
h1{
font-family:'Great Vibes',cursive;
font-size:45px;
margin-bottom:15px;
}

.story-container{
max-width:700px;
overflow-y:auto;
max-height:70vh;
padding-right:10px;
}

/* Responsive */
@media(max-width:600px){
h1{font-size:35px;}
.story-container{font-size:14px;}
}
</style>
</head>

<body>

<!-- Pantalla Inicio -->
<div class="screen fadeIn" id="inicio">
<h1>Para América 💖</h1>
<p style="max-width:500px;">
Desde el momento en que el destino volvió a cruzar nuestros caminos,
supe que no era casualidad…  
Era una promesa disfrazada de juego.
</p>
<button onclick="irHistorias()">Entrar ✨</button>
</div>

<!-- Pantalla Opciones -->
<div class="screen hidden" id="opciones">
<h1>Nuestras Historias 💞</h1>
<button onclick="verHistoria(1)">Ofir y el Amor</button>
<button onclick="verHistoria(2)">Donde Siempre Volvimos a Elegirnos</button>
<button onclick="volverInicio()" style="margin-top:40px;">Volver</button>
</div>

<!-- Pantalla Historia -->
<div class="screen hidden" id="historia">
<h1 id="tituloHistoria"></h1>
<div class="story-container" id="contenidoHistoria"></div>
<button onclick="volverOpciones()">Elegir otra historia</button>
</div>

<script>
function irHistorias(){
document.getElementById("inicio").classList.add("hidden");
document.getElementById("opciones").classList.remove("hidden");
}

function volverInicio(){
document.getElementById("opciones").classList.add("hidden");
document.getElementById("inicio").classList.remove("hidden");
}

function volverOpciones(){
document.getElementById("historia").classList.add("hidden");
document.getElementById("opciones").classList.remove("hidden");
}

function verHistoria(num){
let titulo = document.getElementById("tituloHistoria");
let contenido = document.getElementById("contenidoHistoria");

if(num===1){
titulo.innerText="Ofir y el Amor";
contenido.innerHTML=`
<p>
Había una vez un soñador llamado José Fabricio,
que construía algo grande llamado Ofir.
Pero el verdadero tesoro no era oro…
era América.
Ella fue apoyo, calma y fe cuando los días eran difíciles.
Y mientras él soñaba con grandeza,
ella soñaba con verlo lograrlo.
No era solo una historia de comercio…
era una historia de amor que crecía junto a cada meta.
</p>
`;
}

if(num===2){
titulo.innerText="Donde Siempre Volvimos a Elegirnos";
contenido.innerHTML=`
<p>
Nos conocimos, la vida nos separó…
pero el destino nos volvió rivales en un juego.
Desde Cochabamba viajé hasta Potosí
solo para verte, abrazarte y amarte.
Viajé una vez.
Luego otra.
Y lo volvería a hacer mil veces más.
El 19 de diciembre de 2025
decidimos comprometernos.
Porque aunque haya despedidas
y lágrimas después de cada viaje,
siempre volvemos a elegirnos.
</p>
`;
}

document.getElementById("opciones").classList.add("hidden");
document.getElementById("historia").classList.remove("hidden");
}

/* Crear corazones animados */
function crearCorazon(){
const heart=document.createElement("div");
heart.classList.add("heart");
heart.innerHTML="💖";
heart.style.left=Math.random()*100+"%";
heart.style.fontSize=(Math.random()*20+15)+"px";
heart.style.animationDuration=(Math.random()*5+5)+"s";
document.body.appendChild(heart);
setTimeout(()=>{heart.remove();},8000);
}
setInterval(crearCorazon,600);
</script>

</body>
</html>
