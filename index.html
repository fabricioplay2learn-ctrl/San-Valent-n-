<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>José ❤️ América</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>

/* Responsividad botones */
.love-responsive{
width:80%;
max-width:250px;
font-size:clamp(14px,4vw,18px);
padding:14px;
}

/* Corazón adaptable */
.big-heart{
font-size:clamp(50px,12vw,90px);
transition:transform 0.4s ease, font-size 0.4s ease;
position:relative;
display:flex;
justify-content:center;
align-items:center;
}

/* Texto interno animado */
.big-heart span{
position:absolute;
color:white;
font-size:clamp(12px,3vw,18px);
text-align:center;
padding:10px;
opacity:0;
transform:scale(0.5);
animation:loveReveal 1.5s ease forwards;
}

@keyframes loveReveal{
to{
opacity:1;
transform:scale(1);
}
}

/* Corazones cayendo */
.falling-heart{
position:fixed;
top:-20px;
font-size:20px;
color:#ff4fa3;
animation:fall 4s linear forwards;
z-index:999;
}

@keyframes fall{
0%{transform:translateY(0) rotate(0deg);opacity:1;}
100%{transform:translateY(100vh) rotate(360deg);opacity:0;}
}

*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:'Poppins',sans-serif;
background:linear-gradient(160deg,#0f0f0f,#1a1a1a,#262626);
color:white;
min-height:100vh;
overflow:hidden;
position:relative;
}

/* Borde iluminado */
body::before{
content:"";
position:fixed;
top:10px;
left:10px;
right:10px;
bottom:10px;
border-radius:25px;
box-shadow:
0 0 20px #ff4fa3,
0 0 40px rgba(255,79,163,0.6),
inset 0 0 30px rgba(255,79,163,0.2);
pointer-events:none;
z-index:1;
}

/* BOTÓN FLECHA SUPERIOR */
.back-btn{
position:fixed;
top:20px;
left:20px;
width:45px;
height:45px;
border:none;
border-radius:50%;
background:rgba(255,79,163,0.15);
color:#ff85c1;
font-size:22px;
cursor:pointer;
z-index:1000;
backdrop-filter:blur(6px);
box-shadow:0 0 10px #ff4fa3;
transition:0.3s;
display:flex;
justify-content:center;
align-items:center;
}

.back-btn:hover{
transform:scale(1.15);
box-shadow:0 0 20px #ff85c1;
}

.hidden-back{
opacity:0;
pointer-events:none;
}

/* Pantallas */
.screen{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:25px;
z-index:2;
transition:1s ease;
}

.hidden{
opacity:0;
pointer-events:none;
transform:scale(0.95);
}

h1{
font-family:'Great Vibes',cursive;
font-size:52px;
margin-bottom:20px;
color:#ff85c1;
text-shadow:0 0 15px #ff4fa3;
}

.fade-text{
opacity:0;
transform:translateY(20px);
transition:1s ease;
margin-bottom:15px;
max-width:700px;
}

.fade-text.show{
opacity:1;
transform:translateY(0);
}

.heart-btn{
margin-top:15px;
padding:14px 35px;
border:none;
border-radius:50px;
background:#ff4fa3;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
box-shadow:0 0 15px #ff4fa3;
animation:heartbeat 1.6s infinite;
transition:0.3s;
}

@keyframes heartbeat{
0%{transform:scale(1);}
25%{transform:scale(1.1);}
50%{transform:scale(1);}
75%{transform:scale(1.15);}
100%{transform:scale(1);}
}

.story-container{
max-height:65vh;
overflow-y:auto;
padding:10px;
}

</style>
</head>

<body>

<button class="back-btn hidden-back" onclick="goBack()">←</button>

<!-- Tus pantallas aquí (inicio, opciones, historia) -->

<script>

/* Referencias */
const inicio = document.getElementById("inicio");
const opciones = document.getElementById("opciones");
const historia = document.getElementById("historia");
const backBtn = document.querySelector(".back-btn");

/* Botón atrás */
function goBack(){
if(!opciones.classList.contains("hidden")){
volverInicio();
}
else if(!historia.classList.contains("hidden")){
volverOpciones();
}
}

function updateBackButton(){
if(!inicio.classList.contains("hidden")){
backBtn.classList.add("hidden-back");
}else{
backBtn.classList.remove("hidden-back");
}
}

/* Modifica tus funciones de navegación así */
function irOpciones(){
inicio.classList.add("hidden");
opciones.classList.remove("hidden");
updateBackButton();
}

function volverInicio(){
opciones.classList.add("hidden");
inicio.classList.remove("hidden");
updateBackButton();
}

function volverOpciones(){
historia.classList.add("hidden");
opciones.classList.remove("hidden");
updateBackButton();
}

</script>

</body>
</html>
